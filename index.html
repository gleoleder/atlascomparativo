define({id: "1273cd51", inputs: ["Plot","d3","indice","seleccionA","seleccionB"], outputs: ["leyendaLineal","leyendaA","leyendaB"], body: (Plot,d3,indice,seleccionA,seleccionB) => {
// ── Leyendas ────────────────────────────────────────────────────
function leyendaLineal(colormap, ayuda, format) {
  const valores = colormap.map((c) => c[0]);
  const domain  = [Math.min(...valores), Math.max(...valores)];
  return Plot.legend({
    margin: 0,
    height: 44,
    label: ayuda,
    className: "leyenda",
    color: {
      type: "linear",
      domain,
      range: colormap.map((c) => c[1]),
      tickFormat: d3.format(format),
    },
  });
}

const leyendaA = leyendaLineal(
  indice[seleccionA].colormap,
  indice[seleccionA].ayuda,
  indice[seleccionA].format
);

const leyendaB = leyendaLineal(
  indice[seleccionB].colormap,
  indice[seleccionB].ayuda,
  indice[seleccionB].format
);
return {leyendaLineal,leyendaA,leyendaB};
}});

define({id: "82e32af1", inputs: ["campos","invalido"], outputs: ["capaLineal"], body: (campos,invalido) => {
// ── Capa lineal MapLibre ────────────────────────────────────────
function capaLineal(campo, colormap) {
  return {
    id: campo,
    type: "fill",
    source: "atlas",
    "source-layer": "manzanos",
    paint: {
      "fill-color": [
        "let", "v", ["to-number", ["get", campos[campo]]],
        [
          "case",
          ["any",
            ["!", ["has", campos[campo]]],
            ["!=", ["var", "v"], ["var", "v"]]
          ],
          invalido,
          ["interpolate", ["linear"], ["var", "v"], ...colormap.flat()],
        ],
      ],
      "fill-opacity": ["interpolate", ["linear"], ["zoom"], 6, 0.25, 12, 0.82],
    },
    minzoom: 8,
  };
}
return {capaLineal};
}});

define({id: "26f2c498", inputs: ["campos","d3","indice"], outputs: ["bindHover"], body: (campos,d3,indice) => {
// ── Popup helper ────────────────────────────────────────────────
function bindHover(map, popup, campo) {
  if (map.__hoverHandlers) {
    const h = map.__hoverHandlers;
    map.off("mouseenter", h.layer, h.enter);
    map.off("mouseleave", h.layer, h.leave);
    map.off("click", h.layer, h.clickIn);
    map.off("click", h.clickAny);
  }

  const enter = (e) => {
    map.getCanvas().style.cursor = "pointer";
    const f = e.features?.[0];
    if (!f) return;
    const raw = f.properties?.[campos[campo]];
    const n = typeof raw === "number" ? raw : raw == null ? NaN : +raw;
    if (!Number.isFinite(n)) { map.getCanvas().style.cursor = ""; popup.remove(); return; }
    const fmt = d3.format(indice[campo].format);
    popup
      .setHTML(`<div class="popup-inner"><div class="popup-desc">${indice[campo].ayuda}</div><div class="popup-val">${fmt(n)}</div></div>`)
      .setLngLat(e.lngLat)
      .addTo(map);
  };

  let locked = false;
  const leave = () => { map.getCanvas().style.cursor = ""; if (!locked) popup.remove(); };
  const clickIn = () => { locked = true; };
  const clickAny = (e) => {
    if (!map.queryRenderedFeatures(e.point, { layers: [campo] }).length) {
      locked = false; popup.remove();
    }
  };

  map.on("mouseenter", campo, enter);
  map.on("mouseleave", campo, leave);
  map.on("click", campo, clickIn);
  map.on("click", clickAny);
  map.__hoverHandlers = { layer: campo, enter, leave, clickIn, clickAny };
}
return {bindHover};
}});

define({id: "a9b6c8d3", inputs: ["indice","mapA","capaLineal","bindHover","popupA","readyA","seleccionA"], outputs: ["applyA"], body: async (indice,mapA,capaLineal,bindHover,popupA,readyA,seleccionA) => {

  }
  mapA.addLayer(capaLineal(campo, indice[campo].colormap), "etiquetas");
  bindHover(mapA, popupA, campo);
}

{ await readyA; applyA(seleccionA); }
return {applyA};
}});

function highlightManzano(geom, lng, lat) {
  const geojson = {
    type: "FeatureCollection",
    features: [{ type: "Feature", geometry: geom, properties: {} }],
  };
  mapA.getSource("highlight")?.setData(geojson);
  mapB.getSource("highlight")?.setData(geojson);
  if (lng != null && lat != null) {
    mapA.flyTo({ center: [lng, lat], zoom: 15, duration: 700 });
    mapB.flyTo({ center: [lng, lat], zoom: 15, duration: 700 });
  }
}

// ── Resaltar múltiples manzanos (selección por área) ────────────
function highlightMultiple(indices, gms, lngs_, lats_) {
  const features = [];
  let sumLng = 0, sumLat = 0, count = 0;
  for (const i of indices) {
    if (gms[i]) {
      features.push({ type: "Feature", geometry: gms[i], properties: {} });
      if (lngs_[i] != null) { sumLng += lngs_[i]; sumLat += lats_[i]; count++; }
    }
  }
  const geojson = { type: "FeatureCollection", features };
  mapA.getSource("highlight")?.setData(geojson);
  mapB.getSource("highlight")?.setData(geojson);
  if (count > 0 && indices.size <= 30) {
    const cLng = sumLng / count, cLat = sumLat / count;
    mapA.flyTo({ center: [cLng, cLat], zoom: 14, duration: 600 });
    mapB.flyTo({ center: [cLng, cLat], zoom: 14, duration: 600 });
  }
}

function clearHighlight() {
  const empty = { type: "FeatureCollection", features: [] };
  mapA.getSource("highlight")?.setData(empty);
  mapB.getSource("highlight")?.setData(empty);
}
return {highlightManzano,highlightMultiple,clearHighlight};
}});

define({id: "c8be20d8", inputs: ["Mutable","indice","mapA"], outputs: ["rawFeatures","fetchCityData"], body: (Mutable,indice,mapA) => {
// ── Features capturadas de la ciudad (independiente del zoom) ───

function fetchCityData() {

  rawFeatures.value = mapA.queryRenderedFeatures({ layers: [layer] });
}
return {rawFeatures,fetchCityData};
}});

define({id: "18198a81", inputs: ["corrResult","html","interpretarPearson","colorReg","interpretarR2"], outputs: ["corrStatsPanel"], body: (corrResult,html,interpretarPearson,colorReg,interpretarR2) => {
// ── Panel de estadísticas de correlación ────────────────────────
const corrStatsPanel = (() => {
  if (!corrResult) {
    return html`<div class="no-data-msg">
      Selecciona una ciudad y espera a que carguen los datos para ver las correlaciones.
    </div>`;
  }

  const { n, r, rho, tau, regresiones } = corrResult;

  function statCard(label, value, interp, cls) {
    const fv = isFinite(value) ? value.toFixed(3) : "—";
    return html`<div class="stat-card">
      <div class="stat-label">${label}</div>
      <div class="stat-value ${cls}">${fv}</div>
      <div class="stat-interp">${interp}</div>
    </div>`;
  }

  const clsR  = !isFinite(r)   ? "neu" : r   >= 0 ? "pos" : "neg";
  const clsRho = !isFinite(rho) ? "neu" : rho >= 0 ? "pos" : "neg";
  const clsTau = !isFinite(tau) ? "neu" : tau >= 0 ? "pos" : "neg";

  const cards = html`<div class="stat-cards">
    ${statCard("Pearson r", r,   `lineal · ${interpretarPearson(r)}`,   clsR)}
    ${statCard("Spearman ρ", rho, `rangos · ${interpretarPearson(rho)}`, clsRho)}
    ${statCard("Kendall τ", tau, `ordinal · ${interpretarPearson(tau)}`, clsTau)}
    ${statCard("n manzanas", n, "en la vista actual", "neu")}
  </div>`;

  const filas = regresiones.map((reg) => {
    const r2v = isFinite(reg.r2) ? reg.r2 : 0;
    const pct = Math.max(0, Math.min(1, r2v)) * 100;
    return html`<tr>
      <td class="reg-tipo">
        <span class="reg-dot" style="background:${colorReg[reg.type] ?? '#fff'}"></span>
        ${reg.type}
      </td>
      <td class="reg-ec">${reg.label}</td>
      <td>
        <span class="reg-r2-bar-wrap">
          <span class="reg-r2-bar" style="width:${pct}%;background:${colorReg[reg.type] ?? '#10b981'}"></span>
        </span>
        ${isFinite(reg.r2) ? reg.r2.toFixed(3) : "—"}
        <span style="font-size:0.58rem;color:var(--muted)"> (${interpretarR2(reg.r2)})</span>
      </td>
    </tr>`;
  });

  const tabla = html`<table class="reg-table">
    <thead>
      <tr>
        <th>Tipo</th>
        <th>Ecuación</th>
        <th>R²</th>
      </tr>
    </thead>
    <tbody>${filas}</tbody>
  </table>`;

  return html`<div>${cards}${tabla}</div>`;
})();
return {corrStatsPanel};
}});

define({id: "f0a7865b", inputs: ["mapA","mapB"], body: (mapA,mapB) => {
// ── Resize handle ────────────────────────────────────────────────
{
  const handle = document.getElementById("corr-resize");
  const dual   = document.querySelector(".app-dual");

  let startY = 0, startH = 0;

  handle.addEventListener("mousedown", (e) => {
    e.preventDefault();
    startY = e.clientY;
    startH = dual.getBoundingClientRect().height;
    handle.classList.add("dragging");
    document.body.style.userSelect = "none";
    document.body.style.cursor = "row-resize";

    let rafId = null;
    const onMove = (e) => {
      if (rafId) return; // throttle al frame rate del monitor
      rafId = requestAnimationFrame(() => {
        rafId = null;
        const delta = e.clientY - startY;
        const newH  = Math.max(150, Math.min(window.innerHeight - 200, startH + delta));
        dual.style.flex = `0 0 ${newH}px`;
      });
    };

    const onUp = () => {
      handle.classList.remove("dragging");
      document.body.style.userSelect = "";
      document.body.style.cursor = "";
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
      mapA.resize();
      mapB.resize();
    };

    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });

  // Touch support
  handle.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    startY = t.clientY;
    startH = dual.getBoundingClientRect().height;
    const onMove = (e) => {
      const delta = e.touches[0].clientY - startY;
      const newH  = Math.max(150, Math.min(window.innerHeight - 200, startH + delta));
      dual.style.flex = `0 0 ${newH}px`;
    };
    const onEnd = () => {
      handle.removeEventListener("touchmove", onMove);
      handle.removeEventListener("touchend", onEnd);
      mapA.resize(); mapB.resize();
    };
    handle.addEventListener("touchmove", onMove);
    handle.addEventListener("touchend", onEnd);
  }, { passive: true });
}
}});

define({id: "a714a104", inputs: ["corrResult","html","d3","indice","seleccionA","seleccionB","colorReg","highlightManzano","highlightMultiple","clearHighlight"], outputs: ["corrScatterPlot"], body: (corrResult,html,d3,indice,seleccionA,seleccionB,colorReg,highlightManzano,highlightMultiple,clearHighlight) => {
// ── Scatter plot Canvas 2D — rápido con cualquier cantidad de puntos ──
const corrScatterPlot = (() => {
  if (!corrResult || corrResult.n < 5) {
    return html`<div class="no-data-msg" style="min-width:320px;padding:24px 0">
      ${corrResult
        ? `Solo ${corrResult.n} puntos. Presiona "Buscar" para cargar la ciudad completa.`
        : "Selecciona una ciudad y presiona Buscar."}
    </div>`;
  }

  const { xs, ys, lngs, lats, geoms, regresiones } = corrResult;
  const n = xs.length;

  // ── Dimensiones y márgenes ───────────────────────────────────
  const W  = Math.min(820, Math.max(460, window.innerWidth * 0.54));
  const H  = Math.round(W * 0.60);
  const ML = 68, MR = 16, MT = 18, MB = 58;
  const PW = W - ML - MR, PH = H - MT - MB;
  const dpr = window.devicePixelRatio || 1;

  // ── Escala de datos ──────────────────────────────────────────
  const xmin = Math.min(...xs), xmax = Math.max(...xs);
  const ymin = Math.min(...ys), ymax = Math.max(...ys);
  const xRange = xmax - xmin || 1, yRange = ymax - ymin || 1;
  const sx = (v) => ML + (v - xmin) / xRange * PW;
  const sy = (v) => MT + PH - (v - ymin) / yRange * PH;
  // Inversa para tooltip
  const ixFromPx = (px) => xmin + (px - ML) / PW * xRange;
  const iyFromPy = (py) => ymin + (MT + PH - py) / PH * yRange;

  // ── Ticks bonitos ────────────────────────────────────────────
  function niceTicks(lo, hi, count = 5) {
    const raw = (hi - lo) / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const nice = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => (hi - lo) / s <= count + 1) || mag * 10;
    const ticks = [];
    for (let v = Math.ceil(lo / nice) * nice; v <= hi + nice * 0.01; v += nice)
      ticks.push(+v.toPrecision(8));
    return ticks;
  }
  const xTicks = niceTicks(xmin, xmax, 6);
  const yTicks = niceTicks(ymin, ymax, 5);

  // ── Canvas ───────────────────────────────────────────────────
  const canvas = document.createElement("canvas");
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + "px";
  canvas.style.height = H + "px";
  canvas.style.cursor = "crosshair";
  canvas.style.display = "block";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);

  // ── Estado de selección (lasso libre) ───────────────────────
  let selectedSet = new Set();
  let lassoPath   = [];          // [{cx,cy}] puntos del trazo libre
  let isLassoing  = false;

  // ── Ray-casting: punto dentro del polígono lasso ─────────────
  function pointInLasso(px, py, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i].cx, yi = poly[i].cy;
      const xj = poly[j].cx, yj = poly[j].cy;
      if (((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi))
        inside = !inside;
    }
    return inside;
  }

  // ── Función de dibujo ────────────────────────────────────────
  function draw(hoveredIdx = -1, lasso = null) {
    ctx.clearRect(0, 0, W, H);

    // Fondo área de plot
    ctx.fillStyle = "rgba(22,27,34,0.72)";
    ctx.fillRect(ML, MT, PW, PH);

    // Grilla
    ctx.strokeStyle = "#2d333b";
    ctx.lineWidth = 0.5;
    xTicks.forEach(v => {
      const x = sx(v);
      ctx.beginPath(); ctx.moveTo(x, MT); ctx.lineTo(x, MT + PH); ctx.stroke();
    });
    yTicks.forEach(v => {
      const y = sy(v);
      ctx.beginPath(); ctx.moveTo(ML, y); ctx.lineTo(ML + PW, y); ctx.stroke();
    });

    // Etiquetas de ejes
    ctx.font = `11px 'Space Grotesk', sans-serif`;
    ctx.fillStyle = "#8b949e";
    ctx.textAlign = "center";
    xTicks.forEach(v => ctx.fillText(d3.format(".3~g")(v), sx(v), MT + PH + 16));
    ctx.textAlign = "right";
    yTicks.forEach(v => ctx.fillText(d3.format(".3~g")(v), ML - 6, sy(v) + 4));

    // Título de ejes
    ctx.fillStyle = "#e6edf3";
    ctx.font = `600 12px 'Space Grotesk', sans-serif`;
    ctx.textAlign = "center";
    ctx.fillText(indice[seleccionA]?.nombre ?? seleccionA, ML + PW / 2, H - 12);
    ctx.save();
    ctx.translate(13, MT + PH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(indice[seleccionB]?.nombre ?? seleccionB, 0, 0);
    ctx.restore();

    // Líneas de regresión
    for (const reg of regresiones) {
      ctx.strokeStyle = colorReg[reg.type] ?? "#fff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      let first = true;
      for (let i = 0; i <= 400; i++) {
        const xv = xmin + xRange * i / 400;
        const yv = reg.fn(xv);
        if (!isFinite(yv) || yv < ymin - yRange || yv > ymax + yRange * 2) { first = true; continue; }
        if (first) { ctx.moveTo(sx(xv), sy(yv)); first = false; }
        else ctx.lineTo(sx(xv), sy(yv));
      }
      ctx.stroke();
    }

    // Puntos
    for (let i = 0; i < n; i++) {
      if (i === hoveredIdx) continue;
      const px = sx(xs[i]), py = sy(ys[i]);
      if (selectedSet.has(i)) {
        // Seleccionado por brush → ámbar
        ctx.fillStyle = "rgba(245,158,11,0.85)";
        ctx.beginPath(); ctx.arc(px, py, 3.5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = selectedSet.size > 0 ? "rgba(16,185,129,0.2)" : "rgba(16,185,129,0.5)";
        ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Punto hover resaltado
    if (hoveredIdx >= 0) {
      const px = sx(xs[hoveredIdx]), py = sy(ys[hoveredIdx]);
      ctx.fillStyle = "#f59e0b";
      ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
    }

    // Lasso libre en curso
    if (lasso && lasso.length > 1) {
      ctx.beginPath();
      ctx.moveTo(lasso[0].cx, lasso[0].cy);
      for (let k = 1; k < lasso.length; k++) ctx.lineTo(lasso[k].cx, lasso[k].cy);
      ctx.closePath();
      ctx.fillStyle = "rgba(245,158,11,0.10)";
      ctx.fill();
      ctx.strokeStyle = "#f59e0b";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Borde
    ctx.strokeStyle = "#444c56"; ctx.lineWidth = 1;
    ctx.strokeRect(ML, MT, PW, PH);
  }

  draw();

  // ── Leyenda HTML (fuera del canvas, a la derecha) ────────────
  const legendDiv = document.createElement("div");
  legendDiv.style.cssText = `
    display:flex;flex-direction:column;justify-content:center;gap:6px;
    padding:10px 14px;min-width:168px;
    background:rgba(22,27,34,0.72);border:1px solid #30363d;border-radius:8px;
    font-family:'Space Grotesk',sans-serif;align-self:center;flex-shrink:0;
  `;
  // n total + info selección
  const nEl = document.createElement("div");
  nEl.style.cssText = `font-size:10px;color:#8b949e;letter-spacing:0.05em;margin-bottom:4px;border-bottom:1px solid #30363d;padding-bottom:6px;`;
  nEl.textContent = `n = ${n.toLocaleString()}`;
  legendDiv.appendChild(nEl);

  const selEl = document.createElement("div");
  selEl.style.cssText = `font-size:10px;color:#f59e0b;letter-spacing:0.04em;margin-bottom:4px;border-bottom:1px solid #30363d;padding-bottom:6px;display:none;`;
  selEl.textContent = "";
  legendDiv.insertBefore(selEl, nEl.nextSibling);

  function updateSelInfo() {
    if (selectedSet.size === 0) {
      selEl.style.display = "none";
    } else {
      selEl.style.display = "block";
      selEl.textContent = `Seleccionados: ${selectedSet.size}  (doble clic para limpiar)`;
    }
  }
  // items de regresión
  for (const reg of regresiones) {
    const r2txt = isFinite(reg.r2) ? reg.r2.toFixed(3) : "—";
    const item = document.createElement("div");
    item.style.cssText = `display:flex;align-items:center;gap:7px;`;
    const line = document.createElement("span");
    line.style.cssText = `display:inline-block;width:22px;height:2px;border-radius:2px;flex-shrink:0;background:${colorReg[reg.type] ?? "#fff"};`;
    const lbl = document.createElement("span");
    lbl.style.cssText = `font-size:11px;color:#e6edf3;white-space:nowrap;`;
    lbl.innerHTML = `${reg.type} &nbsp;<span style="color:#8b949e">R²=${r2txt}</span>`;
    item.appendChild(line);
    item.appendChild(lbl);
    legendDiv.appendChild(item);
  }

  // ── Tooltip overlay ──────────────────────────────────────────
  const outer = document.createElement("div");
  outer.style.cssText = "display:flex;align-items:flex-start;gap:12px;";
  const wrap = document.createElement("div");
  wrap.style.cssText = "position:relative;display:inline-block;flex-shrink:0;";
  const tip = document.createElement("div");
  tip.style.cssText = `position:absolute;pointer-events:none;display:none;
    background:rgba(22,27,34,0.96);border:1px solid #30363d;border-radius:6px;
    padding:6px 10px;font-size:12px;color:#e6edf3;
    font-family:'Space Grotesk',sans-serif;white-space:nowrap;z-index:100;`;
  wrap.appendChild(canvas);
  wrap.appendChild(tip);
  outer.appendChild(wrap);
  outer.appendChild(legendDiv);

  // ── Estado hover ─────────────────────────────────────────────
  let hoverIdx = -1;
  const THRESHOLD_SQ = 20 * 20;

  function canvasXY(e) {
    const r = canvas.getBoundingClientRect();
    return { cx: e.clientX - r.left, cy: e.clientY - r.top };
  }
  function clampToPlot(cx, cy) {
    return {
      cx: Math.max(ML, Math.min(ML + PW, cx)),
      cy: Math.max(MT, Math.min(MT + PH, cy)),
    };
  }

  // ── Mousedown: inicio de lasso ────────────────────────────────
  canvas.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    const { cx, cy } = canvasXY(e);
    if (cx < ML || cx > ML + PW || cy < MT || cy > MT + PH) return;
    isLassoing = true;
    lassoPath  = [clampToPlot(cx, cy)];
    tip.style.display = "none";
    e.preventDefault();
  });

  // ── Mousemove: trazo libre O hover ────────────────────────────
  canvas.addEventListener("mousemove", (e) => {
    const { cx, cy } = canvasXY(e);

    if (isLassoing) {
      lassoPath.push(clampToPlot(cx, cy));
      draw(-1, lassoPath);
      return;
    }

    if (cx < ML || cx > ML + PW || cy < MT || cy > MT + PH) {
      if (hoverIdx !== -1) { hoverIdx = -1; draw(); tip.style.display = "none"; }
      return;
    }
    let minD = THRESHOLD_SQ, idx = -1;
    for (let i = 0; i < n; i++) {
      const dx = sx(xs[i]) - cx, dy = sy(ys[i]) - cy;
      const d = dx * dx + dy * dy;
      if (d < minD) { minD = d; idx = i; }
    }
    if (idx === hoverIdx) return;
    hoverIdx = idx;
    draw(idx);
    if (idx >= 0 && selectedSet.size === 0) {
      const fmtA = d3.format(indice[seleccionA]?.format ?? ".4~g");
      const fmtB = d3.format(indice[seleccionB]?.format ?? ".4~g");
      tip.innerHTML =
        `<b>${indice[seleccionA]?.nombre ?? seleccionA}:</b> ${fmtA(xs[idx])}<br>` +
        `<b>${indice[seleccionB]?.nombre ?? seleccionB}:</b> ${fmtB(ys[idx])}<br>` +
        `<span style="color:#8b949e;font-size:10px">Click · Mantén y dibuja para seleccionar grupo</span>`;
      const tx = Math.min(sx(xs[idx]) + 12, W - 180);
      const ty = Math.max(sy(ys[idx]) - 56, 0);
      tip.style.left = tx + "px"; tip.style.top = ty + "px";
      tip.style.display = "block";
    } else {
      tip.style.display = "none";
    }
  });

  // ── Mouseup: cerrar lasso y calcular selección ────────────────
  canvas.addEventListener("mouseup", (e) => {
    if (!isLassoing) return;
    isLassoing = false;
    const totalDist = lassoPath.reduce((acc, p, i) => {
      if (i === 0) return 0;
      return acc + Math.abs(p.cx - lassoPath[i-1].cx) + Math.abs(p.cy - lassoPath[i-1].cy);
    }, 0);

    if (totalDist < 8) {
      // Click simple → selección de un punto
      lassoPath = [];
      draw();
      if (hoverIdx >= 0) {
        const geom = geoms[hoverIdx];
        const lng = lngs[hoverIdx], lat = lats[hoverIdx];
        if (geom) highlightManzano(geom, lng, lat);
        else if (lng != null) highlightManzano({ type: "Point", coordinates: [lng, lat] }, lng, lat);
        selectedSet.clear();
        updateSelInfo();
      }
    } else {
      // Lasso → selección múltiple por ray-casting
      const poly = lassoPath;
      selectedSet = new Set();
      for (let i = 0; i < n; i++) {
        if (pointInLasso(sx(xs[i]), sy(ys[i]), poly)) selectedSet.add(i);
      }
      lassoPath = [];
      draw();
      if (selectedSet.size > 0) {
        highlightMultiple(selectedSet, geoms, lngs, lats);
      } else {
        clearHighlight();
      }
      updateSelInfo();
      tip.style.display = "none";
    }
  });

  // Cancelar lasso si el mouse sale del canvas
  canvas.addEventListener("mouseleave", () => {
    if (isLassoing) {
      isLassoing = false; lassoPath = []; draw();
    }
    if (hoverIdx !== -1) { hoverIdx = -1; draw(); }
    tip.style.display = "none";
  });

  // ── Doble clic: limpiar todo ──────────────────────────────────
  canvas.addEventListener("dblclick", () => {
    selectedSet.clear();
    updateSelInfo();
    draw();
    clearHighlight();
  });

  return outer;
})();
return {corrScatterPlot};
}});

</script>
